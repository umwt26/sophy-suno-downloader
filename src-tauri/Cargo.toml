[package]
name = "sophy"
version = "1.1.0"
description = "Sophy Studio - Modern Audio & Music Production Suite"
authors = ["Beli! (@umw26t)"]
license = "MIT"
repository = "https://github.com/umwt26/Sophy-Studio"
edition = "2021"

[lib]
name = "sophy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.4", features = [] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
sophy-core = { path = "../crates/sophy-core" }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
rfd = "0.15"
base64 = "0.22"

